<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Стол и дело — предметы для рабочего места: лампы, клавиатуры, блокноты и аудио. Доставка за 1–2 дня, гарантия до 5 лет, возврат 60 дней.">
  <meta name="theme-color" content="#f6f5f2">
  <meta name="color-scheme" content="light dark">
  <title>Стол и дело — предметы для ясной работы</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23b5592f'/%3E%3Ctext x='32' y='44' font-family='Segoe UI,Arial' font-size='34' font-weight='700' text-anchor='middle' fill='%23fff'%3E%D0%A1%3C/text%3E%3C/svg%3E">
  <script>
    (function () {
      var theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      try {
        var saved = localStorage.getItem('shopproject-theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
      } catch {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
