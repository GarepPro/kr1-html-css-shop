name: Deploy to GitHub Pages

# Сборка Vite и публикация dist/ на GitHub Pages.
# Источник в настройках репозитория: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно выполняется один деплой; новый запуск отменяет незавершённый.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: false

      - name: Build Go practice
        run: npm run build:practice

      - name: Install dependencies
        run: npm ci

      - name: Build
        # VITE_APP_BASE — подкаталог сайта для basename React Router.
        # Скрипт build также создаёт dist/404.html и dist/.nojekyll.
        run: npm run build
        env:
          VITE_APP_BASE: /kr1-html-css-shop/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
